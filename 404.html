<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SeaMeet - Loading...</title>
  
  <!-- GitHub Pages Hash Routing - Proper redirect for SPA -->
  <script>
    // Convert path-based URL to hash-based URL for SPA compatibility
    const path = window.location.pathname;
    const search = window.location.search;
    const hash = window.location.hash;
    
    if (path !== '/') {
      // Convert /en/pricing to /#/en/pricing
      const hashPath = '#' + path + search;
      const targetUrl = window.location.origin + '/' + hashPath;
      
      console.log('🔄 404 Redirect:', path, '→', targetUrl);
      window.location.replace(targetUrl);
    } else {
      // If already at root, redirect to default language
      window.location.replace(window.location.origin + '/#/en');
    }
  </script>
  
  <!-- Fallback CSS -->
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center; 
      padding: 3rem 1rem;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { max-width: 500px; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin: 0 auto 2rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 { font-size: 2rem; margin-bottom: 1rem; }
    p { opacity: 0.9; line-height: 1.6; }
    a { color: white; }
  </style>
</head>

<body>
  <div class="container">
    <div class="spinner"></div>

    </noscript>
  </div>
</body>

</html>
