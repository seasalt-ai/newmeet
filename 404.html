<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | SeaMeet</title>

  <!-- GitHub Pages serves this file with a 404 status to everyone.
       Crawlers must see a clean 404 (no JS/meta redirect), so GSC
       classifies dead URLs as "Not found" and drops them quickly.
       Humans get a friendly redirect to the homepage. -->
  <script>
    // No "whatsapp" token: the link-preview fetcher doesn't execute JS (it
    // sees the raw 404 anyway), while humans opening links in the WhatsApp
    // in-app browser (Android WebView) DO carry the token and need the
    // redirect. facebookexternalhit covers Meta's crawler family.
    (function () {
      var BOT_UA = /bot|crawl|spider|slurp|headless|lighthouse|facebookexternalhit|googleother|google-inspectiontool|chatgpt-user|perplexity-user|claude-web|oai-searchbot/i;
      if (BOT_UA.test(navigator.userAgent)) return;
      if (window.location.pathname !== '/') {
        window.location.replace(window.location.origin + '/');
      }
    })();
  </script>
  
  <!-- Fallback CSS -->
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center; 
      padding: 3rem 1rem;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { max-width: 500px; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin: 0 auto 2rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 { font-size: 2rem; margin-bottom: 1rem; }
    p { opacity: 0.9; line-height: 1.6; }
    a { color: white; }
  </style>
</head>

<body>
  <div class="container">
      <div class="spinner"></div>
      <h1>404</h1>
      <p>The page you are looking for does not exist or has been moved.</p>
      <p><a href="/">Go to homepage</a></p>
      <noscript>
        <p>JavaScript is disabled, so we can't redirect you — visit <a href="/">seameet.ai</a> directly.</p>
      </noscript>
  </div>
</body>

</html>
